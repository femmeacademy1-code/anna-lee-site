# Deploys the forms Worker (worker/leads.js) to Cloudflare at forms.annalee-milstein.com.
# Needs these repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   token with: Account > Workers Scripts > Edit, and Zone > DNS > Edit (for annalee-milstein.com)
#   CLOUDFLARE_ACCOUNT_ID
#   BREVO_API_KEY          Brevo > SMTP & API > API Keys
#   BREVO_SENDER_EMAIL     a sender verified in Brevo
#   NOTIFY_EMAIL           where Anna gets a note for every new lead
#   BREVO_LIST_REGISTRANTS list number for the lecture registrants   (Brevo > Contacts > Lists)
#   BREVO_LIST_ID          list number for the newsletter
name: Deploy forms Worker
on:
  push:
    branches: [main]
    paths: ['worker/**']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
      NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
      BREVO_LIST_REGISTRANTS: ${{ secrets.BREVO_LIST_REGISTRANTS }}
      BREVO_LIST_ID: ${{ secrets.BREVO_LIST_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        run: |
          ok=1
          for n in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID BREVO_API_KEY BREVO_SENDER_EMAIL NOTIFY_EMAIL; do
            v="${!n}"
            if [ -z "$v" ]; then echo "::error::Secret $n is missing."; ok=0
            else case "$v" in *[[:space:]]*) echo "::error::Secret $n contains a space or line break. Paste only the value, on one line."; ok=0;; esac; fi
          done
          [ "$ok" = 1 ]
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: '4'
          command: deploy
      - name: Set Worker secrets
        working-directory: worker
        run: |
          jq -n --arg k "$BREVO_API_KEY" --arg s "$BREVO_SENDER_EMAIL" --arg n "$NOTIFY_EMAIL" --arg r "$BREVO_LIST_REGISTRANTS" --arg l "$BREVO_LIST_ID" \
            '{BREVO_API_KEY:$k, BREVO_SENDER_EMAIL:$s, NOTIFY_EMAIL:$n} + (if $r != "" then {BREVO_LIST_REGISTRANTS:$r} else {} end) + (if $l != "" then {BREVO_LIST_ID:$l} else {} end)' \
            | npx --yes wrangler@4 secret bulk
